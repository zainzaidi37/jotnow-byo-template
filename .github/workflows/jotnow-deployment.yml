name: Jotnow deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        default: update
        type: choice
        options:
          - update
          - backend-only
          - link
          - unlink
          - backfill
          - doctor
          - repair-guide
          - migration-repair
      license_instance_id:
        description: Exact provider instance UUID for recovery adoption after an unresolved link
        required: false
        type: string
      allow_billable_voyage:
        description: Allow doctor's tiny billable Voyage credential probe
        required: false
        default: false
        type: boolean
      migration_version:
        description: Exact migration version for explicit bookkeeping repair
        required: false
        type: string
      migration_status:
        description: applied or reverted
        required: false
        type: choice
        options:
          - applied
          - reverted
      repair_confirmation:
        description: Exact confirmation requested by the repair guide
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: jotnow-deployment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the configuration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1

      - name: Pin pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v6
        with:
          version: 10.15.1

      - name: Prepare pinned operator tools before secrets are exposed
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/.operator-tools"
          mkdir -p "$tools/supabase"
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 15 --max-time 420 \
            "https://github.com/supabase/cli/releases/download/v2.111.0/supabase_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/supabase.tar.gz"
          mkdir -p "$RUNNER_TEMP/supabase-extract"
          tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C "$RUNNER_TEMP/supabase-extract"
          supabase_source="$(dirname "$(find "$RUNNER_TEMP/supabase-extract" -type f -name supabase -print -quit)")"
          test -f "$supabase_source/supabase"
          test -f "$supabase_source/supabase-go"
          cp "$supabase_source/supabase" "$supabase_source/supabase-go" "$tools/supabase/"
          chmod +x "$tools/supabase/supabase" "$tools/supabase/supabase-go"
          "$tools/supabase/supabase" --version | grep -F '2.111.0'
          pnpm install --frozen-lockfile --ignore-scripts
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" --version | grep -F '4.110.0'
          test -x "$(command -v psql)"

      - name: Run read-only doctor
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'doctor'
        shell: bash
        env:
          ALLOW_BILLABLE_VOYAGE: ${{ inputs.allow_billable_voyage }}
          JOTNOW_DATABASE_URL: ${{ secrets.JOTNOW_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          JOTNOW_SUPABASE_PROJECT_REF: ${{ vars.JOTNOW_SUPABASE_PROJECT_REF }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          JOTNOW_DOCTOR_TIMEOUT_MS: '15000'
        run: |
          set -euo pipefail
          args=(doctor)
          if [[ "$ALLOW_BILLABLE_VOYAGE" == 'true' ]]; then
            args+=(--allow-billable-voyage)
          fi
          node vendor/scripts/byo-updater/customer-cli.mjs "${args[@]}"

      - name: Run the selected operation
        if: inputs.operation != 'doctor'
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          DEPLOYMENT_MODE: ${{ vars.JOTNOW_DEPLOYMENT_MODE }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
          MIGRATION_STATUS: ${{ inputs.migration_status }}
          REPAIR_CONFIRMATION: ${{ inputs.repair_confirmation }}
          LICENSE_INSTANCE_ID: ${{ inputs.license_instance_id }}
          GITHUB_PUSH_TOKEN: ${{ github.token }}
          JOTNOW_LICENSE_KEY: ${{ secrets.JOTNOW_LICENSE_KEY }}
          JOTNOW_DATABASE_URL: ${{ secrets.JOTNOW_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JOTNOW_SUPABASE_PROJECT_REF: ${{ vars.JOTNOW_SUPABASE_PROJECT_REF }}
          JOTNOW_PAGES_PROJECT: ${{ vars.JOTNOW_PAGES_PROJECT }}
          JOTNOW_PAGES_BRANCH: ${{ vars.JOTNOW_PAGES_BRANCH }}
          JOTNOW_RELEASE_PIN: ${{ vars.JOTNOW_RELEASE_PIN }}
          JOTNOW_INSTANCE_NAME: ${{ vars.JOTNOW_INSTANCE_NAME }}
          JOTNOW_CONFIGURATION_BRANCH: ${{ github.ref_name }}
          JOTNOW_UPDATER_STATE: ${{ github.workspace }}/.jotnow/deployment
          JOTNOW_TRUST_LIST: ${{ github.workspace }}/trust/production-v1.json
          JOTNOW_PSQL_BIN: /usr/bin/psql
          JOTNOW_SUPABASE_BIN: ${{ github.workspace }}/.operator-tools/supabase/supabase
          JOTNOW_WRANGLER_BIN: ${{ github.workspace }}/node_modules/.bin/wrangler
          JOTNOW_UPDATE_TIMEOUT_MS: '600000'
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_PUSH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          unset auth GITHUB_PUSH_TOKEN
          cleanup() { git config --local --unset-all http.https://github.com/.extraheader || true; }
          trap cleanup EXIT
          case "$OPERATION" in
            update)
              case "${DEPLOYMENT_MODE:-full}" in
                full|backend-only) ;;
                *) echo 'JOTNOW_DEPLOYMENT_MODE must be full or backend-only' >&2; exit 2 ;;
              esac
              node vendor/scripts/byo-updater/customer-cli.mjs update "${DEPLOYMENT_MODE:-full}"
              ;;
            backend-only) node vendor/scripts/byo-updater/customer-cli.mjs update backend-only ;;
            link)
              if [[ -n "$LICENSE_INSTANCE_ID" ]]; then
                node vendor/scripts/byo-updater/customer-cli.mjs link \
                  --adopt-instance "$LICENSE_INSTANCE_ID"
              else
                node vendor/scripts/byo-updater/customer-cli.mjs link
              fi
              ;;
            unlink|backfill|repair-guide)
              node vendor/scripts/byo-updater/customer-cli.mjs "$OPERATION"
              ;;
            migration-repair)
              node vendor/scripts/byo-updater/customer-cli.mjs migration-repair \
                --version "$MIGRATION_VERSION" --status "$MIGRATION_STATUS" \
                --confirm "$REPAIR_CONFIRMATION"
              ;;
            *) echo 'Unsupported operation' >&2; exit 2 ;;
          esac
